<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="RepoEasy archives your GitHub repository traffic, stars and releases so you keep lifetime history, not just 14 days." />
    <title>RepoEasy · GitHub traffic history beyond 14 days</title>
    <!-- link previews; __ORIGIN__ is replaced with BASE_URL by the server -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RepoEasy" />
    <meta property="og:title" content="GitHub forgets your traffic after 14 days. RepoEasy keeps it." />
    <meta property="og:description" content="Archives views, visitors, clones, referrers and stars for your GitHub repositories every day, so you keep the full history. Free for 3 repositories, open source, self-hostable." />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:image" content="__ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A long traffic chart of which GitHub only shows the last 14 days" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="__ORIGIN__/" />
    <!-- real files, not a data: URI: search engines only show an icon they can fetch (Google wants a multiple of 48px) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- the name search results show next to the icon, instead of the bare domain -->
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "RepoEasy", "url": "__ORIGIN__/" }
    </script>
    <script>
      try {
        var t = localStorage.getItem('repoeasy-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
